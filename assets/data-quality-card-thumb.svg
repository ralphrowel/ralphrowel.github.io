<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1810"/>
      <stop offset="50%" stop-color="#14120d"/>
      <stop offset="100%" stop-color="#0a0907"/>
    </linearGradient>

    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a611c"/>
      <stop offset="100%" stop-color="#f0b84c"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="dqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dqGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f0b84c" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" fill="url(#dqBg)"/>
  <rect width="240" height="240" fill="url(#dqGrid)"/>

  <!-- Subtle ambient glow circle -->
  <circle cx="120" cy="110" r="70" fill="#f0b84c" fill-opacity="0.07" filter="url(#dqGlow)"/>

  <!-- Honeycomb decorative watermark -->
  <path d="M120 18 L142 30 L142 56 L120 68 L98 56 L98 30 Z" fill="none" stroke="#f0b84c" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M152 74 L174 86 L174 112 L152 124 L130 112 L130 86 Z" fill="none" stroke="#f0b84c" stroke-width="1" stroke-opacity="0.15"/>
  <path d="M88 74 L110 86 L110 112 L88 124 L66 112 L66 86 Z" fill="none" stroke="#f0b84c" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Top Badges -->
  <g transform="translate(18, 22)">
    <rect x="0" y="0" width="76" height="18" rx="4" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="38" y="12" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="600" fill="#34d399" letter-spacing="0.8" text-anchor="middle">63 PASS</text>
  </g>

  <g transform="translate(146, 22)">
    <rect x="0" y="0" width="76" height="18" rx="4" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="38" y="12" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="600" fill="#60a5fa" letter-spacing="0.8" text-anchor="middle">DOCKER</text>
  </g>

  <!-- Central Pipeline Diagram: Raw -> Clean -> Quality -->
  <!-- Left Box: RAW FILE -->
  <rect x="28" y="80" width="46" height="34" rx="5" fill="#1e1a12" stroke="#f0b84c" stroke-width="1" stroke-opacity="0.4"/>
  <text x="51" y="97" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#f0b84c" text-anchor="middle">RAW</text>
  <text x="51" y="107" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="500" fill="#9c9184" text-anchor="middle">CSV/XLSX</text>

  <!-- Arrow 1 -->
  <line x1="74" y1="97" x2="88" y2="97" stroke="#f0b84c" stroke-width="1.5" stroke-dasharray="2,2"/>
  <polygon points="88,94 94,97 88,100" fill="#f0b84c"/>

  <!-- Center Circle: CLEANING PIPELINE ENGINE -->
  <circle cx="120" cy="97" r="24" fill="#1b1710" stroke="#f0b84c" stroke-width="1.5" filter="url(#dqGlow)"/>
  <text x="120" y="94" font-size="12" text-anchor="middle" fill="#f0b84c">⚡</text>
  <text x="120" y="106" font-family="'Space Grotesk', sans-serif" font-size="7.5" font-weight="700" fill="#ffdc82" text-anchor="middle">PIPELINE</text>

  <!-- Arrow 2 -->
  <line x1="144" y1="97" x2="158" y2="97" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2,2"/>
  <polygon points="158,94 164,97 158,100" fill="#34d399"/>

  <!-- Right Box: CLEANED -->
  <rect x="166" y="80" width="46" height="34" rx="5" fill="#122018" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
  <text x="189" y="97" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">CLEAN</text>
  <text x="189" y="107" font-family="'Space Grotesk', sans-serif" font-size="7" font-weight="500" fill="#9c9184" text-anchor="middle">VERSIONED</text>

  <!-- Lower Quality Metric Card -->
  <g transform="translate(35, 142)">
    <rect x="0" y="0" width="170" height="48" rx="8" fill="#1a1711" stroke="#f0b84c" stroke-width="1" stroke-opacity="0.3"/>
    
    <text x="14" y="22" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#9c9184" letter-spacing="0.5">COMPOSITE DATA SCORE</text>
    <text x="14" y="38" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f0b84c">98.4<tspan font-size="9" font-weight="400" fill="#c99a3e">%</tspan></text>

    <!-- Progress bar track -->
    <rect x="76" y="28" width="80" height="7" rx="3.5" fill="#2a2418"/>
    <rect x="76" y="28" width="76" height="7" rx="3.5" fill="url(#goldBar)"/>
  </g>

  <!-- Bottom Label -->
  <text x="120" y="218" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="600" fill="#9c9184" letter-spacing="1.8" text-anchor="middle">PROFILING &bull; VALIDATION &bull; POWER BI</text>
</svg>
